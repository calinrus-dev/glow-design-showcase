<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title"><title id="title">Lámina conceptual de Glow Design: Componentes, Temas, Movimiento, Muestras. Elegir una variante → Explorar un componente → Comparar estados → Revisar coherencia.</title><rect width="1600" height="960" fill="#0C1317"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C292F" stroke-width="0.6"/></pattern></defs><rect width="1600" height="960" fill="url(#grid)"/><text x="64" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="33" fill="#EDF0E9" font-weight="600">Glow Design / MAPA DE EXPERIENCIA</text><text x="64" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#E39AD3" font-weight="600">LÁMINA CONCEPTUAL · DATOS FICTICIOS · NO ES UNA CAPTURA DEL PRODUCTO</text><rect x="64" y="169" width="905" height="491" rx="12" fill="#10191E" stroke="#304047"/><rect x="84" y="189" width="865" height="38" rx="7" fill="#1C282F" stroke="#304047"/><text x="105" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#CCD5D7" font-weight="600">GLOW DESIGN / ESTUDIO VISUAL</text><text x="105" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#E39AD3" font-weight="600">FORMA / ESTADO / MOVIMIENTO</text><rect x="102" y="310" width="263" height="73" rx="8" fill="#18282E" stroke="#3A4B52"/><text x="127" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#E8EDE9" font-weight="400">Base</text><rect x="381" y="310" width="263" height="73" rx="8" fill="#48364E" stroke="#3A4B52"/><text x="406" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#E8EDE9" font-weight="400">Seleccionado</text><rect x="660" y="310" width="263" height="73" rx="8" fill="#18282E" stroke="#E39AD3"/><text x="685" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#E39AD3" font-weight="400">Foco</t